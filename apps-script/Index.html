all muted">${Math.min(total,3)}</span></div>${cs.slice(0,3).map(c=>`<div class="queue-item"><div class="row between"><span class="small"><b>${e(c.name)}</b></span>${icon(C.progress(c)===6?'check':'clock')}</div><p>${!c.extracted?'Turn intake notes into a client profile.':C.missing(c).includes('role')?'Review extracted facts before writing.':C.progress(c)===6?'Prepare the approved report.':'Review and complete the remaining modules.'}</p><button style="margin-top:11px" data-action="open" data-id="${e(c.id)}">${!c.extracted?'Review intake':'Continue working'} &nbsp; →</button></div>`).join('')||'<div class="panel-body muted small">No pending work.</div>'}</div></div></div><div class="workflow">${[['01','Understand the client','Capture the story and confirm the facts.'],['02','Build the strategy','Create with clarity and intention.'],['03','Review with care','Refine the details. Approve the work.'],['04','Deliver confidently','One polished, client-ready report.']].map(([n,t,d])=>`<div class="step"><div class="step-num">${n} / THE PROCESS</div><h3>${t}</h3><p>${d}</p></div>`).join('')}</div><div class="footer-note">${icon('shield')} Your expertise stays at the center. Every final deliverable needs your approval.</div>`;}
  function clientsPage(title='Clients'){const cs=state.clients.filter(c=>c.name.toLowerCase().includes(state.query.toLowerCase())&&(state.filter==='all'||status(c)===state.filter));return `${heading(title,title==='AI workspace'?'Select a client to develop their profile and strategy.':'Good relationships start with understanding.')}<div class="toolbar"><input id="search" type="search" placeholder="Search clients…" aria-label="Search clients" value="${e(state.query)}"><select id="filter" style="width:auto" aria-label="Filter by status">${[['all','All clients'],['intake','New intake'],['draft','In progress'],['approved','Approved']].map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="panel">${cs.length?table(cs):empty('No clients found','Add a client or change your search.')}</div>`;}
  function newClient(){const guided=[['role','Current role'],['audience','Target audience'],['offer','Core offer'],['goal','LinkedIn goal'],['tone','Preferred tone'],['cta','Call to action'],['experience','Relevant experience'],['proof','Evidence or results']];return `${heading('Start with their story.','A guided intake now. A clearer direction next.',false)}<form id="new-form" class="panel" style="max-width:980px"><div class="panel-header"><div><h2>New client</h2><p>Complete the fields you know. Missing details can be identified after extraction.</p></div><span class="status intake">01 / Intake</span></div><div class="panel-body">${!LIVE?'<div class="notice warning">Presentation demo: use fictional information only. Data is saved in this browser.</div>':''}<div class="form-grid"><div class="field"><label for="name">Client name</label><input id="name" name="name" required maxlength="100" placeholder="e.g. Alex Morgan"></div><div class="field"><label for="service">Service</label><select id="service" name="service"><option>Full profile</option><option>Profile audit</option><option>Brand strategy</option></select></div><div class="field wide"><label for="url">LinkedIn profile URL <span class="muted">(optional)</span></label><input id="url" name="url" type="url" maxlength="250" placeholder="https://www.linkedin.com/in/…"><small>A reference link only. The workspace does not scrape LinkedIn.</small></div><div class="wide intake-section"><div><h3>Guided client details</h3><p class="small muted">These labels make extraction faster and missing information easier to spot.</p></div><div class="form-grid guided-grid">${guided.map(([id,label])=>`<div class="field"><label for="guide-${id}">${label} <span class="muted">(optional)</span></label><textarea id="guide-${id}" name="guide-${id}" rows="2" maxlength="600" placeholder="Add ${label.toLowerCase()}…"></textarea></div>`).join('')}</div></div><div class="field wide"><div class="row between"><label for="raw">Profile text and additional notes <span class="muted">(optional)</span></label>${button('Use sample notes','sample','','small')}</div><textarea id="raw" name="raw" rows="8" maxlength="7000" placeholder="Paste the existing profile, questionnaire answers or call notes…"></textarea><small>${LIVE?'Gemini will suggest structured facts. You review what is true.':'Use the guided fields or the fictional sample notes to demonstrate extraction.'}</small></div></div><label class="check"><input name="consent" type="checkbox" required> I have permission to process this information${LIVE?', including sending it to Gemini for generation':''}.</label><div class="row between"><span class="small muted">A private Drive folder will be prepared for this client.</span><button class="btn primary" type="submit">Create client ${icon('arrow')}</button></div></div></form>`;}
  function clientPage(){const c=current();if(!c)return empty('Client not found','Reload your workspace.','reload','Reload');const folder=c.workspace?.url?`<a class="btn" href="${e(c.workspace.url)}" target="_blank" rel="noopener noreferrer">${icon('file')} Open Drive folder</a>`:button(icon('file')+(c.workspace?' Folder ready':' Set up Drive folder'),'provision',c.workspace?'disabled':'');return `<div class="heading"><div class="client-heading"><div class="avatar">${e(initials(c.name))}</div><div><h1>${e(c.name)}</h1><p>${e(c.service)} &nbsp; · &nbsp; Revision ${c.revision}</p></div></div><div class="row">${badge(status(c))}${folder}${button(icon('file')+' Report','tab','data-tab="report"')}</div></div><div class="tabs" role="tablist" aria-label="Client workspace">${[['intelligence','Client intelligence'],['studio','AI workspace'],['report','Final report'],['history','Version history']].map(([id,l])=>`<button role="tab" aria-selected="${state.tab===id}" class="${state.tab===id?'active':''}" data-action="tab" data-tab="${id}">${l}</button>`).join('')}</div>${state.tab==='intelligence'?intelligence(c):state.tab==='studio'?studio(c):state.tab==='report'?reportPage(c):historyPage()}`;}
  function intelligence(c){const missing=C.missing(c);return `<div class="notice ${missing.length?'warning':''}">${missing.length?`Still to verify: <b>${missing.map(e).join(', ')}</b>. Missing evidence is a question to ask, not a claim to invent.`:'All intake categories have a reviewed fact. Check the source notes before final approval.'}</div><div class="panel" style="margin-bottom:22px"><div class="panel-header"><div><h2>Source information</h2><p>Use the client’s words as your starting point.</p></div>${button(icon('spark')+(c.extracted?' Re-extract':' Extract information'),'extract','','primary')}</div><div class="panel-body"><label class="sr-only" for="intake-raw">Raw client information</label><textarea id="intake-raw" maxlength="12000" rows="5">${e(c.raw)}</textarea><div class="row between" style="margin-top:12px"><small class="muted">Changing the source clears extracted facts and revokes approvals.</small>${button('Save source','save-intake')}</div></div></div><div class="heading" style="margin-bottom:17px"><div><h2>Verified-facts store</h2><p>${c.facts.filter(f=>f.status==='verified').length} verified · ${c.facts.filter(f=>f.status==='unverified').length} awaiting review · ${c.facts.filter(f=>f.status==='rejected').length} rejected</p></div></div>${c.facts.length?`<div class="facts-grid">${c.facts.map(f=>`<article class="fact"><div class="row between"><h3>${e(f.key)}</h3><span class="status ${f.status==='verified'?'approved':'draft'}">${e(f.status)}</span></div><p>${e(f.value)}</p><blockquote>Source: “${e(f.source)}”</blockquote>${f.evidence?`<p class="small muted">Evidence: ${e(f.evidence)}</p>`:''}${button('Review fact','fact',`data-id="${e(f.id)}"`,'small')}</article>`).join('')}</div>`:empty(c.extracted?'No structured facts found':'Build the client intelligence profile',LIVE?'Add clear source details, then extract again.':'Use labelled sample notes to demonstrate extraction.','extract','Extract information')}`;}
  function studio(c){const key=state.module,m=c.modules[key],checks=C.quality(c,key,m?.content||'');return `<div class="workspace-grid"><div class="module-list">${Object.entries(C.MODULES).map(([id,l])=>`<button class="module-btn ${key===id?'active':''}" data-action="module" data-module="${id}">${l}<span class="status ${c.modules[id]?.status==='approved'?'approved':'draft'}">${c.modules[id]?.status==='approved'?'Approved':c.modules[id]?'Draft':'Not started'}</span></button>`).join('')}</div><div class="panel"><div class="panel-header"><div><h2>${C.MODULES[key]}</h2><p>${LIVE?'Draft from reviewed facts. Refine in your own voice.':'Template preview · deterministic demo, no live AI call'}</p></div>${button(icon('spark')+(m?' Regenerate':' Generate'),'generate','','primary')}</div>${m?.stale?'<div class="notice warning" style="margin:16px 24px 0">Source facts changed. Review and save this draft again before approval.</div>':''}<label class="sr-only" for="editor">${C.MODULES[key]} content</label><textarea id="editor" class="editor" maxlength="6000" placeholder="Generate a first draft, or start writing here…">${e(m?.content||'')}</textarea><div class="editor-meta"><span id="char-count">${m?.content.length||0}</span> characters · ${m?`Version ${m.version} · ${m.status==='approved'?'Approved':'Draft saved'}`:'Not saved'} <span id="dirty-label"></span></div><div class="editor-toolbar">${button('Save draft','save-module','','primary')}${button(icon('copy')+' Copy','copy')}${button(icon('check')+' Approve','approve',m?'':'disabled')}<span class="small muted" style="margin-left:auto">${m?.approvedAt?'Reviewed '+date(m.approvedAt):'Your review is the final step.'}</span></div><div class="quality-box"><h3>Quality review</h3>${checks.length?`<ul>${checks.map(x=>`<li>${e(x)}</li>`).join('')}</ul>`:'<p style="margin-top:10px;color:var(--green)">✓ Automated checks passed for the saved version.</p>'}<p class="muted" style="margin-top:9px">Checks catch missing inputs, length limits and obvious placeholders. Confirm every claim, the tone and client fit before approval.</p></div></div></div>`;}
  function reportPage(c){const ready=C.progress(c)===6;return `<div class="notice ${ready?'':'warning'}">${ready?'All six modules are approved. Your final report is ready.':`${C.progress(c)} of 6 modules approved. You can export a marked draft now; approve every module for a final report.`}</div><div class="heading"><div><h2>Client delivery package</h2><p>Profile audit, rewrites, positioning and content pillars.</p></div><div class="row">${button(icon('download')+' Draft HTML','export','data-final="false"')}${button(icon('download')+' Final '+(LIVE?'PDF':'HTML'),'export',`data-final="true" ${ready?'':'disabled'}`,'primary')}</div></div><div class="report-preview"><div class="eyebrow" style="color:var(--green)">UMAMA · CLIENT STRATEGY</div><h1 style="margin:20px 0 10px">${e(c.name)}</h1><p class="muted">${ready?'Approved package':'Draft preview'} · Revision ${c.revision}</p>${Object.entries(C.MODULES).map(([k,l])=>`<h2>${l}</h2>${badge(c.modules[k]?.status||'Not prepared')}<pre>${e(c.modules[k]?.content||'Not prepared yet.')}</pre>`).join('')}</div><p class="small muted" style="margin-top:14px">HTML reports can be opened in a browser and printed to PDF. Live final PDFs are saved in the configured private Drive folder.</p>`;}
  function historyPage(){return `<div class="panel"><div class="panel-header"><div><h2>Version history</h2><p>Saved revisions are retained. Conflicting edits cannot overwrite a newer revision.</p></div>${button('Refresh','history')}</div>${state.history.map(x=>`<div class="history-item"><b>Revision ${x.revision}</b> &nbsp; ${e(x.type)}<small>${e(x.actor)} · ${e(new Date(x.at).toLocaleString())}</small></div>`).join('')||'<div class="panel-body muted">Select Refresh to load saved history.</div>'}</div>`;}
  function reports(){return `${heading('A polished finish.','Prepare the work you’ve reviewed for client delivery.',false)}<div class="panel"><div class="panel-header"><h2>Client reports</h2><span class="small muted">Approval required for final delivery</span></div>${state.clients.length?table(state.clients):empty('No reports yet','Start with a client intake.')}</div>`;}
  function settings(){return `${heading('Workspace settings','A clear boundary between the presentation and private client work.',false)}<div class="settings-grid"><div class="panel"><div class="panel-body"><span class="eyebrow muted">ENVIRONMENT</span><h2 style="margin-top:14px">${LIVE?'Private Google workspace':'Presentation demo'}</h2><p>${LIVE?'Signed in as '+e(state.actor)+'. Client records are stored in your configured private spreadsheet.':'Demo records live only in this browser. Generation uses transparent templates, and no information is sent to Gemini.'}</p>${button('Reload saved workspace','reload')}${!LIVE?button('Reset fictional demo','reset','','danger'):''}</div></div><div class="panel"><div class="panel-body"><span class="eyebrow muted">ACCESS & CONNECTIONS</span><h2 style="margin-top:14px">${LIVE?'Google authenticated':'Google sign-in for live work'}</h2><p>${LIVE?(state.aiConfigured?'Gemini is configured on the server.':'Gemini is not configured. An administrator must add the server-side key and model.'):'Configure Apps Script using the included setup guide, then add its private workspace URL to the public configuration file.'}</p>${!LIVE?button('Open live workspace','live-login'):''}<p>API keys are never entered here. Keep the public portfolio in a separate site and repository.</p></div></div><div class="panel wide"><div class="panel-body"><h2>Designed for careful client work</h2><p>Extracted information starts unverified. Human review establishes approved facts. Drafts remain editable, each save creates a revision, and source changes invalidate approvals. Final reports need all six modules approved.</p><p>Live access is protected by Google sign-in and a server-side admin allowlist. This is an internal single-business workspace; client logins and automatic LinkedIn publishing are outside Phase 1.</p></div></div></div>`;}
  function render(){shell(state.page==='dashboard'?dashboard():state.page==='clients'?clientsPage():state.page==='production'?clientsPage('AI workspace'):state.page==='new'?newClient():state.page==='client'?clientPage():state.page==='reports'?reports():settings());}
  function modal(html){const d=$('#modal');d.innerHTML=html;d.showModal();}
  function download(html,name){const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
  async function start(){await busy(async()=>{try{const data=await request('bootstrap');Object.assign(state,data,{page:'dashboard',dirty:false});render();}catch(err){state.page='settings';state.clients=[];state.dirty=false;render();throw err;}});}
  document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;const nav=['nav','new','open','tab','module','logout','reload'];if(nav.includes(a)&&!confirmLeave())return;if(nav.includes(a))state.dirty=false;
    if(a==='enter-demo'){sessionStorage.setItem('umama-demo-open','1');start();}
    else if(a==='live-login'){const url=window.WORKSPACE_CONFIG?.portalUrl;if(typeof url==='string'&&/^(?:https:\/\/icpyouthcircle-ops\.github\.io\/umama-ai-workspace\/)?portal\.html$/.test(url))location.href=url;else modal('<h2>Connect your private workspace</h2><p class="muted">The GitHub-hosted private portal has not been configured.</p><div class="actions">'+button('Close','close')+'</div>');}
    else if(a==='nav'){state.page=b.dataset.page;state.query='';state.filter='all';render();}
    else if(a==='new'){state.page='new';render();}
    else if(a==='open'){state.clientId=b.dataset.id;state.tab=state.page==='reports'?'report':state.page==='production'?'studio':'intelligence';state.page='client';state.history=[];render();}
    else if(a==='tab'){state.tab=b.dataset.tab;render();if(state.tab==='history')busy(async()=>{state.history=await request('history',{id:current().id});render();});}
    else if(a==='module'){state.module=b.dataset.module;render();}
    else if(a==='logout'){state.clients=[];sessionStorage.removeItem('umama-demo-open');if(LIVE&&window.UMAMA_REMOTE_AUTH){$('#app').innerHTML='<div class="boot">Signing out…</div>';window.UMAMA_REMOTE_AUTH.signOut().finally(()=>location.reload());}else if(LIVE){$('#app').innerHTML='<div class="boot"><h1>Workspace locked</h1><p>Close this tab to leave. Reload to authenticate with Google again.</p><p class="small muted">This does not sign you out of your Google account.</p></div>';}else login();}
    else if(a==='sample'){$('#raw').value=WorkspaceSamples.raw;state.dirty=true;}
    else if(a==='reload')start();
    else if(a==='close')$('#modal').close();
    else if(a==='extract'){if(state.dirty){toast('Save your source edits before extracting.',true);return;}if(current().facts.some(f=>f.status==='verified')&&!confirm('Re-extraction resets fact verification and revokes approvals. Continue?'))return;busy(async()=>{await save('extract');render();toast('Information extracted. Review each fact before generating.');});}
    else if(a==='provision')busy(async()=>{await save('provision');render();toast(LIVE?'Private client folders are ready in Drive.':'Demo folder setup completed.');});
    else if(a==='save-intake')busy(async()=>{const c=current();await save('change',{command:{type:'intake',payload:{name:c.name,url:c.url,service:c.service,raw:$('#intake-raw').value,consent:c.consent}}});render();toast('Source saved. Extract the updated information next.');});
    else if(a==='fact'){if(state.dirty){toast('Save your source edits before reviewing facts.',true);return;}const f=current().facts.find(x=>x.id===b.dataset.id);modal(`<h2>Review ${e(f.key)}</h2><form id="fact-form" data-id="${e(f.id)}"><div class="field"><label for="fact-value">Confirmed value</label><textarea id="fact-value" name="value" required maxlength="600">${e(f.value)}</textarea></div><p class="notice">Source: ${e(f.source)}</p><div class="field"><label for="fact-status">Review decision</label><select id="fact-status" name="status">${['unverified','verified','rejected'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="evidence">Evidence or confirmation note</label><textarea id="evidence" name="evidence" maxlength="500" placeholder="What did you check? Record a document reference or client confirmation.">${e(f.evidence)}</textarea><small>Required to mark a fact verified. Extraction alone is not verification.</small></div><div class="actions">${button('Cancel','close')}<button class="btn primary" type="submit">Save review</button></div></form>`);}
    else if(a==='generate'){if(state.dirty&&!confirm('Replace the text you have not saved?'))return;busy(async()=>{await save('generate',{module:state.module});render();toast(LIVE?'Draft generated. Review before approving.':'Demo draft created from verified facts.');});}
    else if(a==='save-module')busy(async()=>{await save('change',{command:{type:'module',payload:{module:state.module,content:$('#editor').value}}});render();toast('Draft saved as a new version.');});
    else if(a==='copy')busy(async()=>{await navigator.clipboard.writeText($('#editor').value);toast('Copied to clipboard.');});
    else if(a==='approve'){if(state.dirty){toast('Save your edits before approving.',true);return;}const c=current(),m=c.modules[state.module];const errors=C.quality(c,state.module,m?.content);if(m?.stale)errors.push('Review and save the draft after source changes.');if(errors.length){toast(errors.join(' '),true);return;}modal(`<h2>Approve ${C.MODULES[state.module].toLowerCase()}</h2><p class="muted">Approval applies to this saved version. Editing content or changing source facts revokes it.</p><form id="approve-form"><label class="check"><input type="checkbox" name="attested" required> I have checked every factual claim against the verified source material, removed unsupported promises, and reviewed the wording for this client.</label><div class="actions">${button('Cancel','close')}<button class="btn primary" type="submit">Approve this version</button></div></form>`);}
    else if(a==='history')busy(async()=>{state.history=await request('history',{id:current().id});render();});
    else if(a==='export')busy(async()=>{const c=current(),final=b.dataset.final==='true';const r=await request('report',{id:c.id,expectedRevision:c.revision,final});if(r.url){modal(`<h2>Final report saved</h2><p class="muted">The PDF is in your private Drive folder.</p><div class="actions"><a class="btn primary" href="${e(r.url)}" target="_blank" rel="noopener noreferrer">Open PDF</a>${button('Close','close')}</div>`);}else download(r.html,`${c.name.replace(/[^a-z0-9]+/gi,'-')}-${final?'final':'draft'}.html`);toast('Report generated.');});
    else if(a==='reset'){if(!confirm('Reset all fictional demo clients and their version history?'))return;busy(async()=>{await withDemoLock(()=>localStorage.removeItem(KEY));const data=await request('bootstrap');Object.assign(state,data,{dirty:false});render();toast('Demo reset.');});}
  });
  document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,d=new FormData(f);if(f.id==='new-form')busy(async()=>{const labels={role:'Role',audience:'Audience',offer:'Offer',goal:'Goal',tone:'Tone',cta:'CTA',experience:'Experience',proof:'Proof'};const guided=Object.entries(labels).map(([k,l])=>{const value=String(d.get('guide-'+k)||'').trim();return value?`${l}: ${value}`:'';}).filter(Boolean);const notes=String(d.get('raw')||'').trim();const raw=[...guided,notes].filter(Boolean).join('\n');if(!raw)C.fail('VALIDATION','Add at least one guided detail or some profile notes.');await save('create',{data:{name:d.get('name'),url:d.get('url'),service:d.get('service'),raw,consent:d.get('consent')==='on'}});state.page='client';state.tab='intelligence';render();try{await save('provision');render();toast(LIVE?'Client created and private Drive folders prepared.':'Client created with a demo folder preview.');}catch(err){render();toast('Client saved. Drive folder setup needs a retry: '+err.message,true);}});if(f.id==='fact-form')busy(async()=>{await save('change',{command:{type:'fact',payload:{id:f.dataset.id,value:d.get('value'),status:d.get('status'),evidence:d.get('evidence')}}});$('#modal').close();render();toast('Fact review saved. Earlier drafts now need review.');});if(f.id==='approve-form')busy(async()=>{await save('change',{command:{type:'approve',payload:{module:state.module,attested:d.get('attested')==='on'}}});$('#modal').close();render();toast('Version approved.');});});
  document.addEventListener('input',ev=>{if(ev.target.id==='search'){const pos=ev.target.selectionStart;state.query=ev.target.value;render();$('#search').focus();try{$('#search').setSelectionRange(pos,pos);}catch{}return;}if(ev.target.closest('#new-form')||['editor','intake-raw'].includes(ev.target.id)){state.dirty=true;if(ev.target.id==='editor'){$('#char-count').textContent=ev.target.value.length;$('#dirty-label').textContent='· Unsaved edits';}}});
  document.addEventListener('change',ev=>{if(ev.target.id==='filter'){state.filter=ev.target.value;render();}});
  window.addEventListener('beforeunload',ev=>{if(state.dirty){ev.preventDefault();ev.returnValue='';}});
  window.addEventListener('storage',ev=>{if(ev.key===KEY)toast('Demo changed in another tab. Reload before your next edit.',true);});
  if(LIVE)start();else{login();try{if(sessionStorage.getItem('umama-demo-open'))start();}catch{toast('Browser session storage is unavailable. Use a regular browser window.',true);}}
})();
</script></body></html>
